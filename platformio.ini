; EX30 GPS speedometer - Waveshare ESP32-S3-LCD-3.16 + AT6668 GPS receiver

[platformio]
; Local, git-ignored overrides (OTA password, OTA address). Copy secrets_example.ini
; to secrets.ini and edit it. The build works without it, using the defaults below.
extra_configs = secrets.ini

[ota]
; Defaults, overridden by secrets.ini. password must match the device's OTA password.
password = speedo1234
host = ex30-speedo.local

[env:waveshare-esp32-s3-lcd-316]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Keep the RGB LCD in sync while Wi-Fi is active. Flash and PSRAM share one bus on the
; ESP32-S3: Wi-Fi code fetched from flash holds up the bounce-buffer refill and the image
; jumps sideways. These run code from PSRAM and keep the LCD interrupt in internal RAM.
; Rebuilds the Arduino core libraries (needs default_16MB.csv in the project folder).
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
; Not used here, and its default settings fail to compile in the rebuilt core.
custom_component_remove =
    espressif/esp-modbus
; Library versions pinned to the commits this was built and tested against.
; To update, change the hash after the # (or remove it for the latest).
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    mikalhart/TinyGPSPlus @ ^1.1.0
    bblanchon/ArduinoJson @ ^7.2.0

; Over-the-air upload: same build, sent over Wi-Fi. The StopWatch must be on the
; same network as the PC (e.g. both on home Wi-Fi, Network 2).
; Choose this environment in the PlatformIO toolbar, then Upload.
; The password and address come from [ota] above or from secrets.ini.
; Use the IP address as host if .local does not resolve on your PC.
; [env:ota]
; extends = env:waveshare-esp32-s3-lcd-316
; upload_protocol = espota
; upload_port = ${ota.host}
; upload_flags =
;     --auth=${ota.password}
;     --port=3232
